<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | CashOut</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwind + daisyUi CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome CDN / icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md mx-auto bg-base-200 ">
    <!--! header section -->
    <header class="border-b-2 border-gray-400 sticky top-0 bg-[#ffffff] z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="./index.html" class="btn btn-soft text-neutral/50 hover:text-[#0e0d0d]"><i
                        class="fa-solid fa-arrow-right-from-bracket"></i>Log out</a>
            </div>
        </section>
    </header>

    <!-- ! card section -->
    <section class=" bg-[#ffffff] rounded-b-3xl">
        <div class="w-11/12 mx-auto py-10 space-y-5">
            <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
            <p class="text-neutral/50 ">Enjoy easy and convenient financial services with us. Cashout charge is low and
            </p>

            <div class="buttons grid grid-cols-3 gap-3">
                <a href="./home.html" class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-1.png" alt="">
                    <p class="text-neutral/50">Add Money</p>
                </a>
                
                <a href="./cashout.html"  class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-2.png" alt="">
                    <p class="text-neutral/50">Cashout</p>
                </a>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-3.png" alt="">
                    <p class="text-neutral/50">Transfer Money</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-4.png" alt="">
                    <p class="text-neutral/50">Get Bonus</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-5.png" alt="">
                    <p class="text-neutral/50">Pay Bill</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-6.png" alt="">
                    <p class="text-neutral/50">Transactions</p>
                </button>
            </div>
        </div>
    </section>




    <!-- ! Cash Out Section -->
    <section id="cashout" class="w-11/12 mx-auto py-5">
        <h2 class="text-xl font-bold mb-5">Cashout</h2>

        <div class="card bg-base-100 w-full   shadow rounded-2xl">
            <div class="card-body ">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-medium text-[16px]">Agent Number</label>
                    <input id="cashout-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-300 w-full" placeholder="Enter 11 digit number"  />
                    <br>
                    <label class="label text-neutral font-medium text-[16px]">Amount</label>
                    <input id="cashout-amount"  type="number" class="input rounded-full bg-base-300 w-full" placeholder="Enter amount to withdraw" />
                    <br>
                    <label class="label text-neutral font-medium text-[16px]">Pin Number</label>
                    <input id="cashout-pin" maxlength="4" type="password" class="input rounded-full bg-base-300 w-full" placeholder="Enter 4 digit pin number" />
                    <button id="cashout-btn" class="btn btn-primary rounded-full mt-4">Withdraw Money</button>
                </fieldset>
            </div>
    </section>

    <script src="./script/machine.js"></script>
    <script src="./script/cashout.js"></script>
</body>

</html>
