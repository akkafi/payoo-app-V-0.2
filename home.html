<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwind + daisyUi CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome CDN / icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md mx-auto bg-base-200 ">
    <header class="border-b-2 border-gray-400 ">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$<span>45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="./index.html" class="btn btn-soft text-neutral/50"><i
                        class="fa-solid fa-arrow-right-from-bracket"></i>Log out</a>
            </div>
        </section>
    </header>

    <section class=" bg-[#ffffff] rounded-b-3xl">
        <div class="w-11/12 mx-auto py-10 space-y-5">
            <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
            <p class="text-neutral/50 ">Enjoy easy and convenient financial services with us. Cashout charge is low and
            </p>

            <div class="buttons grid grid-cols-3 gap-3">
                <a href="./home.html" class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-1.png" alt="">
                    <p class="text-neutral/50">Add Money</p>
                </a>
                <a href="./cashout.html" class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-2.png" alt="">
                    <p class="text-neutral/50">Cashout</p>
                </a>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-3.png" alt="">
                    <p class="text-neutral/50">Transfer Money</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-4.png" alt="">
                    <p class="text-neutral/50">Get Bonus</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-5.png" alt="">
                    <p class="text-neutral/50">Pay Bill</p>
                </button>
                <button class="btn flex-col h-full py-4 px-3 btn-primary btn-soft">
                    <img src="./assets/opt-6.png" alt="">
                    <p class="text-neutral/50">Transactions</p>
                </button>
            </div>
        </div>
    </section>

    <section class="w-11/12 mx-auto mt-7">
        <div class=" flex justify-between mb-7">
            <h2 class="font-semibold text-[18px] ">Latest Payment</h2>
            <p class="text-neutral/50">View All</p>
        </div>

        <div class="latest-payment-card-container">
            <div class="card bg-[#ffffff] ">
                <div class="flex gap-3">
                    <div class="w-12 h-12 justify-items-center rounded-full bg-[#dbdbdb]">
                        <img class="mt-[10px]" src="./assets/opt-1.png" alt="">
                    </div>
                    <div  class="flex justify-between" >
                        <div>
                            <p>Electricity Bill</p>
                            <p>Today 01:44 AM</p>
                        </div>
                        <div>
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
